<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="加班费计算">
<title>加班费计算与汇总</title>
<style>
  :root { --primary: #3b82f6; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --sub: #64748b; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8; --border: #334155; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px; line-height: 1.5; transition: background 0.3s; }
  .container { max-width: 480px; margin: 0 auto; padding-top: 20px; }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 24px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 8px; }
  input[type="number"] { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s; }
  input[type="number"]:focus { border-color: var(--primary); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .result-box { background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 16px; padding: 24px; color: white; text-align: center; margin-bottom: 20px; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-box p { font-size: 14px; opacity: 0.8; margin-bottom: 8px; }
  .result-box h2 { font-size: 36px; font-weight: 800; margin: 0; }
  .detail-list { list-style: none; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px; }
  .detail-list li { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; opacity: 0.9; }
  .detail-list li:last-child { margin-bottom: 0; }
  .btn { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: white; background: var(--primary); border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.2s; }
  .btn:active { opacity: 0.8; }
</style>
</head>
<body>
<div class="container">
  <h1>💼 加班费计算器</h1>
  <div class="card">
    <div class="form-group">
      <label>月薪 (元)</label>
      <input type="number" id="salary" value="10000" placeholder="例如: 10000">
    </div>
    <div class="row">
      <div class="form-group">
        <label>平时加班 (小时)</label>
        <input type="number" id="weekday" value="0" step="0.5">
      </div>
      <div class="form-group">
        <label>周末加班 (小时)</label>
        <input type="number" id="weekend" value="0" step="0.5">
      </div>
    </div>
    <div class="form-group">
      <label>法定节假日加班 (小时)</label>
      <input type="number" id="holiday" value="0" step="0.5">
    </div>
    <button class="btn" onclick="calculate()">立即计算</button>
  </div>
  <div class="result-box" id="resultBox" style="display: none;">
    <p>本月预估加班费</p>
    <h2 id="totalFee">¥0.00</h2>
    <ul class="detail-list">
      <li><span>时薪基数:</span> <span id="hourlyRate">¥0.00</span></li>
      <li><span>平时 (1.5倍):</span> <span id="weekdayFee">¥0.00</span></li>
      <li><span>周末 (2倍):</span> <span id="weekendFee">¥0.00</span></li>
      <li><span>节假日 (3倍):</span> <span id="holidayFee">¥0.00</span></li>
    </ul>
  </div>
</div>
<script>
  function calculate() {
    const salary = parseFloat(document.getElementById('salary').value) || 0;
    const weekday = parseFloat(document.getElementById('weekday').value) || 0;
    const weekend = parseFloat(document.getElementById('weekend').value) || 0;
    const holiday = parseFloat(document.getElementById('holiday').value) || 0;
    const hourlyRate = salary / 21.75 / 8;
    const weekdayFee = hourlyRate * 1.5 * weekday;
    const weekendFee = hourlyRate * 2 * weekend;
    const holidayFee = hourlyRate * 3 * holiday;
    const totalFee = weekdayFee + weekendFee + holidayFee;
    document.getElementById('hourlyRate').innerText = '¥' + hourlyRate.toFixed(2);
    document.getElementById('weekdayFee').innerText = '¥' + weekdayFee.toFixed(2);
    document.getElementById('weekendFee').innerText = '¥' + weekendFee.toFixed(2);
    document.getElementById('holidayFee').innerText = '¥' + holidayFee.toFixed(2);
    document.getElementById('totalFee').innerText = '¥' + totalFee.toFixed(2);
    document.getElementById('resultBox').style.display = 'block';
  }
</script>
</body>
</html>
